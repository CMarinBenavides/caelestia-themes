# Caelestia Falls — Gravity Falls
NAME="Caelestia Falls"
DESCRIPTION="Gravity Falls: Grunkle Stan, Bill Cipher and cryptograms"
EMOJI="🌲🔺"
# Vídeo esperado: la intro oficial "Gravity Falls Opening Theme Song" (~39 s)
VIDEO_DURATION="34-45"
VIDEO_HINT="the official Gravity Falls intro (Opening Theme Song, ~39 s)"
# Plymouth: fotogramas por segundo de la animación
FPS=15
# Terminal: ancho del logo en columnas
LOGO_COLUMNS=18
# cipher: frase cifrada (Atbash / César +3 / A1Z26 según el día) · plain: frase tal cual
# daily: la misma frase todo el día · random: una distinta en cada terminal
QUOTES_ROTATION="daily"
QUOTES_MODE="cipher"
QUOTE_HINT="type 'decode'"
# Carpeta dentro del directorio de wallpapers de Caelestia (IDs de Wallhaven en wallpapers.txt)
WALLPAPER_FOLDER="Gravity Falls Theme"
# Paquetes extra que necesita generate.sh
DEPENDENCIES="ttf-dejavu"
